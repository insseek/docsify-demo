<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Docsify Demo</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="Docsify v5 起步模板：无需构建，用 Markdown 写文档，内置中英文切换与深色模式。"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="_media/favicon.svg" />

    <!-- Docsify v5 核心主题 -->
    <link rel="stylesheet" href="_style/docsify@5-themes-core.min.css" />
    <!-- 深色模式附加样式：默认跟随系统，可用右下角按钮手动切换 -->
    <link
      id="theme-dark"
      rel="stylesheet"
      href="_style/docsify@5-themes-core-dark.min.css"
      media="(prefers-color-scheme: dark)"
    />
    <!-- 自定义样式（悬浮按钮、导航下拉菜单） -->
    <link rel="stylesheet" href="_style/custom.css" />

    <script>
      // 首屏渲染前恢复上次选择的主题，避免闪烁；没有记录时跟随系统
      (() => {
        try {
          const saved = localStorage.getItem('docsify-theme');
          if (saved === 'dark' || saved === 'light') {
            document.getElementById('theme-dark').media =
              saved === 'dark' ? 'all' : 'not all';
            document.documentElement.dataset.theme = saved;
          }
        } catch (error) {
          /* localStorage 不可用时忽略 */
        }
      })();
    </script>
  </head>

  <body class="loading sidebar-chevron-right">
    <div id="app"></div>

    <!-- 右下角悬浮控件：语言切换在上，主题切换在下（由脚本填充） -->
    <div id="app-controls" class="app-controls"></div>

    <script>
      window.$docsify = {
        // 站点名称，显示在侧边栏顶部
        name: 'Docsify Demo',

        // 站点名称的链接：按语言回到各自的首页
        nameLink: {
          '/en/': '#/en/',
          '/': '#/',
        },

        // 仓库地址：使用完整 URL，可指向 GitHub、GitLab 或任意代码托管；
        // 设置后在右上角显示 GitHub 风格角标，留空则完全不显示
        repo: 'https://github.com/insseek/docsify-demo',
        cornerExternalLinkTarget: '_blank',

        // 语言目录：中文在根目录，英文在 /en/
        // 让深层页面复用所属语言的 _navbar.md / _sidebar.md，避免逐层回退的 404 请求
        alias: {
          '/en/(.+)/_navbar.md': '/en/_navbar.md',
          '/en/(.+)/_sidebar.md': '/en/_sidebar.md',
          '/(?!en/)(.+)/_navbar.md': '/_navbar.md',
          '/(?!en/)(.+)/_sidebar.md': '/_sidebar.md',
        },
        // 英文页面缺失时回退到默认语言（中文）的同名页面
        fallbackLanguages: ['en'],

        // 侧边栏：按语言目录加载各自的 _sidebar.md；subMaxLevel 控制页面内标题的层级
        loadSidebar: '_sidebar.md',
        subMaxLevel: 3,
        maxLevel: 4,

        // 顶部导航：按语言目录加载各自的 _navbar.md
        loadNavbar: '_navbar.md',

        // 封面页：按语言加载（值相对于当前语言目录，Docsify 会自动补上前缀）
        coverpage: {
          '/en/': '_coverpage.md',
          '/': '_coverpage.md',
        },
        // 只显示封面，不在封面下方渲染首页正文
        onlyCover: false,

        // 访问不存在的页面时，按语言加载 404 内容
        notFoundPage: {
          '/en/': 'en/_404.md',
          '/': '_404.md',
        },

        // 切换页面后自动回到顶部
        auto2top: true,

        // 无障碍“跳到主要内容”链接，按语言显示
        skipLink: {
          '/en/': 'Skip to main content',
          '/': '跳到主要内容',
        },

        // 全文搜索（对应 _script/docsify-search@5.min.js）
        search: {
          placeholder: {
            '/en/': 'Search',
            '/': '搜索',
          },
          noData: {
            '/en/': 'No results found',
            '/': '没有找到相关内容',
          },
          paths: 'auto',
          depth: 2,
          // 中英文使用独立索引，避免缓存串页
          pathNamespaces: ['/en'],
        },

        // 上一节 / 下一节（对应 _script/docsify-pagination@2.10.1.min.js）
        pagination: {
          previousText: {
            '/en/': 'Previous',
            '/': '上一节',
          },
          nextText: {
            '/en/': 'Next',
            '/': '下一节',
          },
          crossChapter: true,
          crossChapterText: true,
        },

        // 微信二维码（右下角悬浮按钮）：enabled: false 可隐藏
        // text 支持字符串，或「路径 → 文案」对象（按当前路由匹配）
        wechat: {
          enabled: true,
          qrcode: '_media/wechat-qrcode.jpg',
          text: {
            '/en/': 'Scan with WeChat to follow 「里探」',
            '/': '微信扫码　关注「里探」',
          },
        },

        // 捐赠二维码：wechat / alipay 各自 enabled: false 可单独隐藏
        donate: {
          wechat: {
            enabled: true,
            qrcode: '_media/wechat-donate.png',
          },
          alipay: {
            enabled: true,
            qrcode: '_media/alipay-donate.jpg',
          },
        },
      };
    </script>

    <!-- Docsify v5.0.0 本体（必须最先加载） -->
    <script src="_script/docsify@5.min.js"></script>
    <!-- 全文搜索插件 -->
    <script src="_script/docsify-search@5.min.js"></script>
    <!-- 分页插件 -->
    <script src="_script/docsify-pagination@2.10.1.min.js"></script>
    <!-- 中英文切换（右下角按钮 + 顶部导航语言菜单增强） -->
    <script src="_script/i18n.js"></script>
    <!-- 深色模式切换（右下角按钮，双击恢复跟随系统） -->
    <script src="_script/theme-toggle.js"></script>
    <!-- 微信二维码（右下角悬浮按钮，由 $docsify.wechat 控制显示） -->
    <script src="_script/wechat.js"></script>
    <!-- 捐赠二维码（捐赠页，由 $docsify.donate 控制显示） -->
    <script src="_script/donate.js"></script>
  </body>
</html>
